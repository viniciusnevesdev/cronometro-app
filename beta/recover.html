<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <title>Recuperar Cronômetro</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f5f7;color:#111114;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}section{width:min(100%,390px);background:#fff;border-radius:22px;padding:22px;box-sizing:border-box;box-shadow:0 10px 30px rgba(0,0,0,.07)}h1{font-size:22px;margin:0 0 8px}.tag{display:inline-block;margin:0 0 10px;padding:5px 8px;border-radius:999px;background:#e9f2ff;color:#007aff;font-size:10px;font-weight:800;letter-spacing:.08em}.tag.beta{background:#fff0dc;color:#c56a00}p{font-size:14px;line-height:1.45;color:#6e6e73;margin:0}.ok{color:#238636}.warn{color:#a15c00}.bad{color:#d92d20}.bar{height:6px;background:#e8e8ed;border-radius:999px;overflow:hidden;margin:18px 0}.bar span{display:block;height:100%;width:18%;background:#007aff;border-radius:inherit;animation:move .9s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(430%)}}.actions{display:grid;gap:9px;margin-top:16px}.actions a{text-decoration:none;text-align:center;padding:12px 14px;border-radius:13px;background:#111114;color:#fff;font-size:14px;font-weight:600}.actions a.secondary{background:#ececf1;color:#111114}.small{font-size:11px;color:#8e8e93;margin-top:11px}@media(prefers-color-scheme:dark){html,body{background:#111114;color:#f7f7f8}section{background:#1c1c1e;box-shadow:none}p,.small{color:#a1a1a6}.bar{background:#2c2c2e}.actions a{background:#f2f2f4;color:#111114}.actions a.secondary{background:#2c2c2e;color:#f7f7f8}}
  </style>

  <link rel="icon" type="image/png" sizes="192x192" href="./app-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
</head>
<body><main><section>
  <span id="env" class="tag">OFICIAL</span><h1>Recuperando o Cronômetro</h1>
  <p id="status">Removendo somente cache e Service Worker da interface. Seus registros e configurações não serão apagados.</p>
  <div class="bar" id="bar"><span></span></div>
  <div class="actions" id="actions" hidden><a href="./launch.html?recover=1">Abrir o app novamente</a><a class="secondary" href="./safe.html?recover=1">Abrir modo seguro</a></div>
  <p class="small">Esta ferramenta nunca executa limpeza do IndexedDB (banco local) nem do localStorage (preferências locais).</p>
</section></main>
<script>
(async()=>{
  const BETA=location.pathname.includes('/beta/');
  const basePath=new URL('./',location.href).pathname;
  const env=document.getElementById('env');if(BETA){env.textContent='BETA';env.classList.add('beta')}
  const status=document.getElementById('status'),actions=document.getElementById('actions'),bar=document.getElementById('bar');
  const cacheMatch=k=>k.startsWith('cronometro-public-demo-');
  const withTimeout=(promise,ms)=>Promise.race([promise,new Promise(resolve=>setTimeout(()=>resolve({timedOut:true}),ms))]);

  async function cleanup(){
    let workers=0,cachesRemoved=0,timedOut=false;
    if('serviceWorker' in navigator){
      const regs=await withTimeout(navigator.serviceWorker.getRegistrations(),800);
      if(regs?.timedOut)timedOut=true;
      else if(Array.isArray(regs)){
        const targets=regs.filter(r=>{try{return new URL(r.scope).pathname===basePath}catch(_){return false}});
        const results=await withTimeout(Promise.allSettled(targets.map(r=>r.unregister())),900);
        if(results?.timedOut)timedOut=true;
        else if(Array.isArray(results))workers=results.filter(r=>r.status==='fulfilled'&&r.value).length;
      }
    }
    if('caches' in window){
      const keys=await withTimeout(caches.keys(),800);
      if(keys?.timedOut)timedOut=true;
      else if(Array.isArray(keys)){
        const results=await withTimeout(Promise.allSettled(keys.filter(cacheMatch).map(k=>caches.delete(k))),900);
        if(results?.timedOut)timedOut=true;
        else if(Array.isArray(results))cachesRemoved=results.filter(r=>r.status==='fulfilled'&&r.value).length;
      }
    }
    return {workers,cachesRemoved,timedOut};
  }

  try{
    const result=await withTimeout(cleanup(),2600);
    const outerTimedOut=!!result?.timedOut;
    const data=outerTimedOut?{workers:0,cachesRemoved:0,timedOut:true}:result;

    let ownRegs=[],ownCaches=[];
    try{
      const regs=await withTimeout(navigator.serviceWorker?.getRegistrations?.()||Promise.resolve([]),450);
      if(Array.isArray(regs))ownRegs=regs.filter(r=>{try{return new URL(r.scope).pathname===basePath}catch(_){return false}});
      const keys=await withTimeout(caches?.keys?.()||Promise.resolve([]),450);
      if(Array.isArray(keys))ownCaches=keys.filter(cacheMatch);
    }catch(_){}

    const runtimeClean=ownRegs.length===0&&ownCaches.length===0;
    const residualController=runtimeClean&&!!navigator.serviceWorker?.controller;
    bar.hidden=true;actions.hidden=false;
    if(runtimeClean){
      status.className='ok';
      status.textContent=`Interface recuperada. ${data.workers||0} Service Worker(s) e ${data.cachesRemoved||0} cache(s) removido(s). Seus dados ${BETA?'da Beta':'Oficiais'} foram preservados.${residualController?' O Safari ainda mostra uma referência residual nesta aba; isso desaparece ao abrir uma nova página.':''}`;
    }else if(data.timedOut){
      status.className='warn';
      status.textContent='A limpeza demorou além do limite seguro. O app não ficará bloqueado: abra novamente ou use o Modo Seguro. Nenhum registro foi apagado.';
    }else{
      status.className='warn';
      status.textContent=`A limpeza terminou parcialmente. Ainda existem ${ownRegs.length} registro(s) de Service Worker e ${ownCaches.length} cache(s) deste ambiente. Seus dados locais continuam preservados.`;
    }
    try{localStorage.setItem(`cronometro-public-demo-last-recovery`,new Date().toISOString())}catch(_){}
  }catch(error){
    status.className='bad';status.textContent='A recuperação da interface não terminou. Nenhum registro foi apagado. Use o Modo Seguro para verificar os dados.';bar.hidden=true;actions.hidden=false;
  }
})();
</script></body></html>
