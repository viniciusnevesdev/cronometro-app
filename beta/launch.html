<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Cronômetro</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f5f7;color:#111114;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}main{width:min(100%,360px);text-align:center}
    .mark{width:54px;height:54px;margin:0 auto 15px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 8px 28px rgba(0,0,0,.07);font-size:25px}
    h1{font-size:24px;line-height:1.15;margin:0 0 8px}.env{display:inline-block;margin-bottom:10px;padding:5px 8px;border-radius:999px;background:#e9f2ff;color:#007aff;font-size:10px;font-weight:800;letter-spacing:.08em}.env.beta{background:#fff0dc;color:#c56a00}
    .status{font-size:14px;color:#6e6e73;line-height:1.45;margin:0}.bar{height:5px;background:#dedee3;border-radius:999px;overflow:hidden;margin:18px 36px}.bar span{display:block;width:35%;height:100%;background:#007aff;border-radius:inherit;animation:move 1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(185%)}}
    .note{font-size:11px;color:#8e8e93;line-height:1.4;margin-top:10px}
    @media(prefers-color-scheme:dark){html,body{background:#111114;color:#f7f7f8}.mark{background:#1c1c1e}.status,.note{color:#a1a1a6}.bar{background:#2c2c2e}}
  </style>

  <link rel="icon" type="image/png" sizes="192x192" href="./app-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">⏱</div>
  <span id="env" class="env">OFICIAL</span>
  <h1 id="title">Cronômetro</h1>
  <p class="status" id="status">Preparando uma abertura limpa…</p>
  <div class="bar"><span></span></div>
  <p class="note">A manutenção de cache nunca bloqueia a abertura por mais de alguns segundos.</p>
</main>
<script>
(() => {
  const RELEASE='0.8.9';
  const BETA=location.pathname.includes('/beta/');
  const status=document.getElementById('status');
  const env=document.getElementById('env');
  const title=document.getElementById('title');
  if(BETA){env.textContent='BETA';env.classList.add('beta');title.textContent='Cronômetro Beta'}
  const cleanupKey=`cronometro-public-demo-launch-clean-${RELEASE}`;
  const basePath=new URL('./',location.href).pathname;
  const cacheMatch=k=>k.startsWith('cronometro-public-demo-');
  const withTimeout=(promise,ms)=>Promise.race([promise,new Promise(resolve=>setTimeout(()=>resolve({timedOut:true}),ms))]);

  async function clean(){
    let needsClean=true;try{needsClean=localStorage.getItem(cleanupKey)!=='1'}catch(_){}
    if(!needsClean)return {skipped:true};
    let workers=0,cachesRemoved=0;
    try{
      if('serviceWorker' in navigator){
        const regs=await withTimeout(navigator.serviceWorker.getRegistrations(),650);
        if(!regs?.timedOut&&Array.isArray(regs)){
          const targets=regs.filter(r=>{try{return new URL(r.scope).pathname===basePath}catch(_){return false}});
          const results=await withTimeout(Promise.allSettled(targets.map(r=>r.unregister())),650);
          if(Array.isArray(results))workers=results.filter(r=>r.status==='fulfilled'&&r.value).length;
        }
      }
      if('caches' in window){
        const keys=await withTimeout(caches.keys(),650);
        if(!keys?.timedOut&&Array.isArray(keys)){
          const results=await withTimeout(Promise.allSettled(keys.filter(cacheMatch).map(k=>caches.delete(k))),650);
          if(Array.isArray(results))cachesRemoved=results.filter(r=>r.status==='fulfilled'&&r.value).length;
        }
      }
      try{localStorage.setItem(cleanupKey,'1')}catch(_){}
      return {workers,cachesRemoved};
    }catch(error){return {error:String(error?.message||error)}}
  }

  (async()=>{
    const result=await withTimeout(clean(),1800);
    if(result?.timedOut)status.textContent='Ambiente web: limpeza continua em segundo plano. Abrindo o app…';
    else if(result?.error)status.textContent='A limpeza não terminou, mas o app será aberto normalmente.';
    else status.textContent='Abrindo a interface…';
    setTimeout(()=>location.replace(`./?launch=${Date.now()}`),120);
  })();
})();
</script>
</body>
</html>
