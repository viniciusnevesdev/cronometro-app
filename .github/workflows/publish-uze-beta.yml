name: Publicar UZE Beta isolada

on:
  push:
    branches: [uze-beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cronometro-uze-beta-publicacao
  cancel-in-progress: true

jobs:
  publish-beta-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - uses: actions/checkout@v4
        with:
          ref: uze-beta
          path: source
      - name: Montar pacote Beta
        run: python3 source/tools/build_beta.py source stable/beta
      - name: Validar isolamento e versão
        run: |
          test -s stable/beta/index.html
          test -s stable/beta/version.json
          test -s stable/beta/environment.json
          grep -q '0.8.11-beta.2' stable/beta/index.html
          grep -q '0.8.11-beta.2' stable/beta/version.json
          grep -q "cronometro_uze_beta_v1" stable/beta/app.js
          ! grep -q "const DB_NAME='cronometro_public_demo_v4';" stable/beta/app.js
          grep -q 'cronometro-uze-beta-' stable/beta/sw.js
      - name: Atualizar apenas /beta na publicação estável
        working-directory: stable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta
          if ! git diff --cached --quiet; then
            git commit -m "chore(uze-beta): publica pacote Beta isolado [skip ci]"
            git push origin main
          fi
